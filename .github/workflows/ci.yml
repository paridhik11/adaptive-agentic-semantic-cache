name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Pinned model revision — this key must match MODEL_REVISION in src/cache/embedding.py.
# Update this value only after re-running the Phase 2 threshold sweep and documenting
# the old-vs-new results in docs/phase2_walkthrough.md.
env:
  MODEL_REVISION: "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Unit tests — network-free, no model loaded
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests (network-free)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run unit tests (no model, no network)
        # The default pytest invocation excludes requires_model tests via pyproject.toml
        # addopts = "-m 'not requires_model'" — no model loading occurs here.
        run: |
          pytest -v

  # ---------------------------------------------------------------------------
  # Job 2: Model integration tests — loads real model, caches by revision hash
  # ---------------------------------------------------------------------------
  model-integration-tests:
    name: Model integration tests (requires_model)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]  # Integration tests only need one Python version

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Cache HuggingFace model (keyed on pinned revision hash)
        # Cache key includes MODEL_REVISION so the cache is invalidated automatically
        # if the pinned revision changes. This prevents stale model weights from being
        # used after a revision update.
        uses: actions/cache@v4
        id: hf-cache
        with:
          path: ~/.cache/huggingface
          key: huggingface-all-MiniLM-L6-v2-${{ env.MODEL_REVISION }}
          restore-keys: |
            huggingface-all-MiniLM-L6-v2-

      - name: Run model integration tests
        # Only tests marked @pytest.mark.requires_model are executed here.
        # These are the ONLY tests allowed to access the network or load the model.
        run: |
          pytest -m requires_model -v

  gateway-container:
    name: Gateway container fixture smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway-only image
        run: docker build -t cache-gateway:test .
      - name: Start and check fixture container
        shell: bash
        run: |
          tenant_token=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')
          admin_token=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')
          echo "::add-mask::$tenant_token"
          echo "::add-mask::$admin_token"
          export SMOKE_TENANT_TOKEN="$tenant_token"
          export GATEWAY_TENANTS_JSON=$(python -c 'import json,os; print(json.dumps({os.environ["SMOKE_TENANT_TOKEN"]:"ci-tenant"}))')
          export GATEWAY_ADMIN_TOKEN="$admin_token"
          docker run -d --name cache-smoke -p 127.0.0.1:8000:8000 \
            -e GATEWAY_TENANTS_JSON -e GATEWAY_ADMIN_TOKEN \
            -e GATEWAY_PROVIDER=fixture -e GATEWAY_CACHE_POLICY=rules \
            -e GATEWAY_CACHE_DB=/state/answers.sqlite -e GATEWAY_CACHE_VERSION=ci-v1 \
            --read-only --tmpfs /tmp --mount type=volume,destination=/state \
            --cap-drop ALL --security-opt no-new-privileges cache-gateway:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          python scripts/smoke_container.py
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs cache-smoke || true
          docker rm -fv cache-smoke || true
