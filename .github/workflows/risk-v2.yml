name: Risk V2 evidence checks
on:
  push:
    branches: [optimize-v2]
  pull_request:
    paths:
      - artifacts/risk_v2/**
      - docs/RISK_V2_*.md
      - scripts/*risk_v2*.py
      - src/policy/hybrid_cache.py
      - .github/workflows/risk-v2.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install report and test dependencies
        run: python -m pip install -r deploy/requirements-gateway.txt 'scipy>=1.10,<2' 'pytest>=8,<10' 'httpx>=0.27,<1'
      - name: Validate frozen inputs and reconcile result receipts
        run: python scripts/report_risk_v2.py --check
      - name: Check existing cache and reporting regressions
        run: python -m pytest -q tests/test_hybrid_cache.py tests/test_release_correction.py tests/test_interview_report.py
