name: Interview V1 offline checks
on:
  push:
    branches: [release/interview-v1]
  pull_request:
    paths:
      - .github/workflows/interview-v1.yml
      - dashboard/interview/**
      - artifacts/interview/**
      - artifacts/metrics_campaign/**
      - scripts/*interview*
      - scripts/evaluate_live_paired.py
      - scripts/run_demo.py
      - src/api/demo.py
      - src/api/workbench.*
      - tests/test_interview_report.py
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline dependencies
        run: python -m pip install -r deploy/requirements-gateway.txt 'scipy>=1.10,<2' 'pytest>=8,<10' 'httpx>=0.27,<1'
      - name: Reconcile dashboard exports and replay the guard experiment
        run: |
          python scripts/report_interview.py --check
          python scripts/interview_guard_experiment.py
      - name: Run release tests
        run: python -m pytest -q tests/test_interview_report.py tests/test_workbench.py tests/test_p1_acceptance.py tests/test_release_correction.py tests/test_before_agent_cache.py tests/test_document_orchestration_memory.py tests/test_harness_acceptance_8.py tests/test_p1_1_harness_acceptance.py
      - name: Run model-free CLI and HTTP demos
        shell: bash
        run: |
          python scripts/run_demo.py --cli --directory "$RUNNER_TEMP/interview"
          python scripts/smoke_workbench.py
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '22'
      - name: Check workbench and analyst dashboard in Chromium
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright-core@1.65.1
          npx playwright-core install --with-deps chromium
          python scripts/run_demo.py --interview --fresh --port 8777 > "$RUNNER_TEMP/interview.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8777/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check_interview_browser.cjs http://127.0.0.1:8777/
