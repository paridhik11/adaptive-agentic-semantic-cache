name: Documentation product checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation-product:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web runtime and engineering test dependencies
        run: python -m pip install -r deploy/requirements-gateway.txt pytest==9.1.1 httpx==0.28.1
      - name: Run documentation product regressions without models
        run: python -m pytest -q tests/test_workbench.py tests/test_document_agent.py tests/test_before_agent_cache.py tests/test_document_orchestration_memory.py tests/test_durable_semantic_rebuild.py tests/test_response_cache.py tests/test_sqlite_response_cache.py
      - name: Verify installed wheel outside source tree
        # The installed-wheel smoke is separate from source-tree regression imports.
        run: |
          python -m pip install build
          python -m build --wheel --outdir "$RUNNER_TEMP/product-wheel"
          python -m pip install --no-deps "$RUNNER_TEMP/product-wheel/"*.whl
          python scripts/check_document_install.py --output "$RUNNER_TEMP/installed-wheel.json"
      - name: Install pinned browser dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Check reference UI in browser
        shell: bash
        run: |
          python scripts/run_demo.py --whole-answer-cache --task-memory --port 8777 --directory "$RUNNER_TEMP/documentation-ui" > "$RUNNER_TEMP/documentation-ui.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8777/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check_workbench_browser.cjs http://127.0.0.1:8777 "$RUNNER_TEMP/documentation-browser-receipt.json"
