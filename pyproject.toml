[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-agentic-semantic-cache"
version = "0.1.0"
description = "Adaptive Semantic Response Reuse Engine for LLM Optimization"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy>=2.0",
    "scikit-learn>=1.0",
    "joblib>=1.3",
    "faiss-cpu>=1.7",
    "sentence-transformers>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# By default, exclude tests that load the real SentenceTransformer model.
# Run model integration tests explicitly: pytest -m requires_model
# This keeps the default `pytest` invocation network-free and fast.
addopts = "-m 'not requires_model'"
markers = [
    "requires_model: marks tests that load the real all-MiniLM-L6-v2 model (may access network if cache absent). Run with: pytest -m requires_model",
]