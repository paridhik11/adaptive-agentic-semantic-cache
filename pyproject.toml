[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-agentic-semantic-cache"
version = "0.1.0"
description = "Adaptive Semantic Response Reuse Engine for LLM Optimization"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy>=2.0",
    "scikit-learn>=1.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]