[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-agentic-semantic-cache"
version = "0.1.0"
description = "Adaptive Semantic Response Reuse Engine for LLM Optimization"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy>=2.0",
    "scikit-learn>=1.0",
    "joblib>=1.3",
    "faiss-cpu>=1.7",
    "sentence-transformers>=2.0",
    "pydantic>=2.0",
    "scipy>=1.10",
    "openai>=1.0",
    "google-genai>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# By default, exclude tests that load the real SentenceTransformer model
# or make live external LLM API calls.
# Run model integration tests explicitly: pytest -m requires_model
# Run LLM API integration tests explicitly: pytest -m requires_llm_api
# This keeps the default `pytest` invocation network-free, hermetic, and fast.
addopts = "-m 'not requires_model and not requires_llm_api'"
markers = [
    "requires_model: marks tests that load the real all-MiniLM-L6-v2 model (may access network if cache absent). Run with: pytest -m requires_model",
    "requires_llm_api: marks tests that make live calls to an external LLM API (requires API key and network). Run with: pytest -m requires_llm_api",
]